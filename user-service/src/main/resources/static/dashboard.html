<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - User Service</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-page">
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>User Dashboard</h1>
                    <p id="welcomeMessage">Welcome!</p>
                </div>
                <button id="logoutBtn" class="btn btn-danger">Logout</button>
            </div>
        </header>
        
        <div class="card">
            <h2>User Management</h2>
            
            <div id="message" class="message"></div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="users">All Users</button>
                <button class="tab-btn" data-tab="profile">My Profile</button>
            </div>
            
            <!-- All Users Tab -->
            <div id="usersTab" class="tab-content active">
                <div class="action-bar">
                    <button id="refreshUsersBtn" class="btn btn-secondary">Refresh Users</button>
                </div>
                
                <div id="usersLoading" class="loading">Loading users...</div>
                
                <div id="usersContainer" style="display: none;">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Contact</th>
                                <th>Age</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content">
                <div id="profileLoading" class="loading">Loading profile...</div>
                
                <div id="profileContainer" style="display: none;">
                    <form id="profileForm">
                        <input type="hidden" id="profileId">
                        <input type="hidden" id="profilePasswordHash">
                        
                        <div class="form-group">
                            <label for="profileName">Full Name</label>
                            <input type="text" id="profileName" name="patientName" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileEmail">Email</label>
                            <input type="email" id="profileEmail" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileContact">Contact Number</label>
                            <input type="tel" id="profileContact" name="contactNumber" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileAge">Age</label>
                            <input type="number" id="profileAge" name="age" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileRole">Role</label>
                            <input type="text" id="profileRole" name="role" readonly>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Edit User Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit User</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <input type="hidden" id="editPasswordHash">
                
                <div class="form-group">
                    <label for="editName">Full Name</label>
                    <input type="text" id="editName" name="patientName" required>
                </div>
                
                <div class="form-group">
                    <label for="editEmail">Email</label>
                    <input type="email" id="editEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="editContact">Contact Number</label>
                    <input type="tel" id="editContact" name="contactNumber" required>
                </div>
                
                <div class="form-group">
                    <label for="editAge">Age</label>
                    <input type="number" id="editAge" name="age" required>
                </div>
                
                <div class="form-group">
                    <label for="editRole">Role</label>
                    <select id="editRole" name="role" required>
                        <option value="PATIENT">Patient</option>
                        <option value="DOCTOR">Doctor</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
